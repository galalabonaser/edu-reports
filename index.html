<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البوابة الرقمية الموحدة للمدارس</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --royal-blue: #0f172a;
            --edu-blue: #1e3a8a;
            --gold-accent: #d97706;
            --blue-gradient: linear-gradient(135deg, #1e3a8a, #3b82f6);
            --bg-light: #f8fafc;
            --card-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); padding: 30px 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 650px; background: #ffffff; border-radius: 30px; box-shadow: var(--card-shadow); padding: 40px 30px; border-top: 12px solid var(--edu-blue); border-bottom: 6px solid var(--gold-accent); position: relative; }
        .school-logo-container { text-align: center; margin-bottom: 25px; }
        .school-badge { width: 100px; height: 100px; background: #1e3a8a !important; border-radius: 50%; display: inline-flex !important; justify-content: center; align-items: center; border: 4px solid #ffffff; box-shadow: 0 10px 25px rgba(30, 58, 138, 0.25); }
        .school-badge i { font-size: 45px !important; color: #fbbf24 !important; display: block !important; }
        .header h1 { font-size: 26px; color: var(--royal-blue); font-weight: 900; text-align: center; margin-bottom: 5px; }
        .header p { color: #64748b; font-size: 14px; text-align: center; margin-bottom: 35px; font-weight: 600; }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 700; font-size: 15px; color: var(--edu-blue); }
        .form-control { width: 100%; padding: 14px 20px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 15px; outline: none; background: #f8fafc; font-weight: 600; }
        .form-control:focus { border-color: var(--edu-blue); background: #ffffff; box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.08); }
        .radio-group { display: flex; gap: 15px; }
        .radio-label { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 14px 20px; border: 2px solid #e2e8f0; border-radius: 14px; width: 100%; background: #f8fafc; font-weight: 700; }
        .radio-label input { accent-color: var(--edu-blue); scale: 1.4; }
        .radio-label:has(input:checked) { border-color: var(--edu-blue); background-color: #f0f4ff; color: var(--edu-blue); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .hidden-field { 
            display: none; 
            background: #fff8f8; 
            padding: 20px; 
            border-right: 5px solid #ef4444; 
            border-radius: 14px; 
            margin-top: 15px; 
        }
        
        /* ميكانيكية الـ CSS لإظهار خانة الغياب فوراً */
        #teacherYesBtn:checked ~ #absentTeacherBlock {
            display: block !important;
        }
        
        .btn-submit { width: 100%; padding: 16px; background: var(--blue-gradient); color: #ffffff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="school-logo-container"><div class="school-badge"><i class="fa-solid fa-graduation-cap"></i></div></div>
        <div class="header">
            <h1>بوابة مدير المدرسة الرقمية</h1>
            <p>نظام الاستبيان اليومي الموحد لإدارة المدارس</p>
        </div>
        
        <form id="quizForm">
            <div class="form-group">
                <label><i class="fa-solid fa-user-tie"></i> اسم مقدم التقرير (مدير المدرسة)</label>
                <input type="text" id="reporterName" class="form-control" placeholder="أدخل اسمك الكامل" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-map-location-dot"></i> اسم المدينة أو القرية</label>
                <input type="text" id="locationName" class="form-control" placeholder="اكتب اسم البلدة / المدينة" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-school"></i> اسم المدرسة</label>
                <input type="text" id="schoolName" class="form-control" placeholder="أدخل الاسم الرسمي للمدرسة" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-circle-half-stroke"></i> الفوج الدراسي</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="schoolShift" value="صباحي" checked> <span>فوج صباحي</span></label>
                    <label class="radio-label"><input type="radio" name="schoolShift" value="مسائي"> <span>فوج مسائي</span></label>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fa-solid fa-users"></i> عدد الطلاب الكلي للمدرسة</label>
                    <input type="number" id="totalStudents" class="form-control" placeholder="0" min="0" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-user-check"></i> عدد الحضور اليوم</label>
                    <input type="number" id="presentStudents" class="form-control" placeholder="0" min="0" required>
                </div>
            </div>
            
            <div class="form-group">
                <label><i class="fa-solid fa-user-minus"></i> هل يوجد أساتذة غائبين؟</label>
                <div class="radio-group" style="position: relative;">
                    <input type="radio" name="hasAbsentTeachers" id="teacherYesBtn" value="نعم" style="display:none;">
                    <label for="teacherYesBtn" class="radio-label"><span>نعم، يوجد غياب</span></label>
                    
                    <input type="radio" name="hasAbsentTeachers" id="teacherNoBtn" value="لا" checked style="display:none;">
                    <label for="teacherNoBtn" class="radio-label"><span>لا يوجد غياب</span></label>

                    <div id="absentTeacherBlock" class="hidden-field" style="position: absolute; top: 60px; right: 0; left: 0; z-index: 10;">
                        <label style="color: #ef4444;"><i class="fa-solid fa-user-xmark"></i> أسماء الأساتذة الغائبين</label>
                        <input type="text" id="absentTeachersNames" class="form-control" placeholder="أدخل الأسماء مفصولة بفاصلة">
                    </div>
                </div>
            </div>

            <div style="height: 110px;"></div>

            <div class="form-group">
                <label><i class="fa-solid fa-hand-holding-hand"></i> احتياجات المدرسة الحالية</label>
                <textarea id="schoolNeeds" class="form-control" rows="3" placeholder="أذكر النواقص أو الطلبات الضرورية هنا..."></textarea>
            </div>
            <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> إرسال التقرير سحابياً</button>
        </form>
    </div>
    <!-- استدعاء مكتبات جوجل فايربيز التقليدية لضمان الإرسال السريع -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // إعدادات الربط السحابي المتوافقة والمطابقة لملف المشرف
        const firebaseConfig = {
            apiKey: "AIzaSyAlcJxqIp14tEpO2Ta_va8nACY3HMBi_p4",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "school-survey-app-fb0a2",
            storageBucket: "school-survey-app-fb0a2.firebasestorage.app",
            messagingSenderId: "958887865762",
            appId: "1:958887865762:web:10c85485f4d423b3bb56fb"
        };

        // تهيئة الفايربيز
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // رفع البيانات السحابية للحفظ عند الضغط على زر الارسال
        document.getElementById('quizForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const now = new Date();
            const timestamp = now.toLocaleDateString('ar-EG') + ' | ' + now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
            
            const total = parseInt(document.getElementById('totalStudents').value) || 0;
            const present = parseInt(document.getElementById('presentStudents').value) || 0;
            const hasAbsent = document.getElementById('teacherYesBtn').checked ? 'نعم' : 'لا';

            const reportData = {
                timestamp: timestamp,
                reporter: document.getElementById('reporterName').value,
                location: document.getElementById('locationName').value,
                school: document.getElementById('schoolName').value,
                shift: document.querySelector('input[name="schoolShift"]:checked').value,
                total: total,
                absentStudents: (total - present >= 0) ? (total - present) : 0,
                absentTeachers: hasAbsent === 'نعم' ? document.getElementById('absentTeachersNames').value : 'لا يوجد غياب',
                needs: document.getElementById('schoolNeeds').value || 'لا يوجد احتياجات مذكورة'
            };

            // الدفع بالبيانات مباشرة إلى مسار 'reports' في السيرفر السحابي
            db.ref('reports').push(reportData)
                .then(() => {
                    alert('✅ تم إرسال تقريرك بنجاح إلى قاعدة بيانات جوجل السحابية!');
                    document.getElementById('quizForm').reset();
                })
                .catch((error) => {
                    alert('❌ فشل الإرسال السحابي: ' + error.message);
                });
        });
    </script>
</body>
</html>
